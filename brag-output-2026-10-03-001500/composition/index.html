<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0D0003; font-family: 'Outfit', sans-serif;
    }
    #root { width: 100%; height: 100%; position: relative; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-duration="20" data-width="1920" data-height="1080">
    <audio id="bgm" src="assets/music/music.mp3" data-start="0" data-duration="20" data-track-index="1"></audio>

    <div id="clip-s1" class="clip" data-composition-id="scene1" data-composition-src="scenes/scene1.html" data-start="0.0" data-duration="2.5" data-track-index="2"></div>
    <div id="clip-s2" class="clip" data-composition-id="scene2" data-composition-src="scenes/scene2.html" data-start="2.5" data-duration="2.5" data-track-index="2"></div>
    <div id="clip-s3" class="clip" data-composition-id="scene3" data-composition-src="scenes/scene3.html" data-start="5.0" data-duration="2.5" data-track-index="2"></div>
    <div id="clip-s4" class="clip" data-composition-id="scene4" data-composition-src="scenes/scene4.html" data-start="7.5" data-duration="3.5" data-track-index="2"></div>
    <div id="clip-s5" class="clip" data-composition-id="scene5" data-composition-src="scenes/scene5.html" data-start="11.0" data-duration="3.0" data-track-index="2"></div>
    <div id="clip-s6" class="clip" data-composition-id="scene6" data-composition-src="scenes/scene6.html" data-start="14.0" data-duration="3.0" data-track-index="2"></div>
    <div id="clip-s7" class="clip" data-composition-id="scene7" data-composition-src="scenes/scene7.html" data-start="17.0" data-duration="3.0" data-track-index="2"></div>
  </div>

  <script>
    document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    });
  </script>
</body>
</html>
